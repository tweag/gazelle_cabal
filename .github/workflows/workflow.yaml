name: Continuous integration
on:
  merge_group:
    branches: main
  push:
    branches: main
  pull_request:
    branches: main
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: '1 11 * * *'
env:
  # Bump this number to invalidate the GH actions cache
  cache-version: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test-nixpkgs:
    name: Build & Test - Nixpkgs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        ghc-version: [ghc_9_4_8, ghc_9_6_7, ghc_9_8_4, ghc_9_10_3]
        enable-bzlmod: [false, true]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mount Bazel cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/repo-cache
          key: repo-cache-${{ runner.os }}-nixpkgs-${{ env.cache-version }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          nix_path: nixpkgs=./nixpkgs.nix
      - uses: tweag/configure-bazel-remote-cache-auth@144b0b915f13a418f5eafe2f68d19564ec136c62 # v0.1.1
        with:
          buildbuddy_api_key: ${{ secrets.BUILDBUDDY_API_KEY }}
          bazelrc_path: .bazelrc.auth
      - name: Configure
        run: |
          bash ./configure_ghc_and_bzlmod.sh ${{ matrix.ghc-version }} ${{ matrix.enable-bzlmod }}
          echo 'build --config=remote-cache' >>.bazelrc.local
      - name: Build & test
        # only for GHC 9.4.8 with bzlmod
        if: ${{ !matrix.enable-bzlmod || matrix.ghc-version == 'ghc_9_4_8' }}
        uses: tweag/run-nix-shell@5d825ec7e0038b6c613f14d523203a2ea49abddb # v0.3.0
        with:
          run: bazel test --config=${{ matrix.ghc-version }} --test_output=all //...
      - name: Test the example
        run: |
          cd example
          bash ./run_test.sh ${{ matrix.ghc-version }}
      - name: Test alternative dependencies
        if: ${{ !matrix.enable-bzlmod }}
        uses: tweag/run-nix-shell@5d825ec7e0038b6c613f14d523203a2ea49abddb # v0.3.0
        with:
          working-directory: tests/alternative-deps
          run: |
            bazel run //:gazelle --config=${{ matrix.ghc-version }}
            bazel run //:gazelle-update-repos --config=${{ matrix.ghc-version }}
            bazel test //... --config=${{ matrix.ghc-version }}
      - name: Test for buildifier suggestions
        # only for GHC 9.4.8 with bzlmod
        if: ${{ !matrix.enable-bzlmod || matrix.ghc-version == 'ghc_9_4_8' }}
        uses: tweag/run-nix-shell@5d825ec7e0038b6c613f14d523203a2ea49abddb # v0.3.0
        with:
          run: bazel test //:buildifier-check

  all_ci_tests:
    runs-on: ubuntu-24.04
    needs:
      - test-nixpkgs
    if: ${{ always() }}
    steps:
      - uses: cgrindel/gha_join_jobs@605424defceef3181c9fde3df903ea8ec35e267a # v1.5.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
